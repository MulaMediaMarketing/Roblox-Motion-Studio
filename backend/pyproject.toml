[project]
name = "kinetic-studio-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.117,<1",
  "uvicorn[standard]>=0.37,<1",
  "pydantic>=2.11,<3",
  "numpy>=2.2,<3",
  "scipy>=1.16,<2",
  "opencv-python>=4.12,<5",
  "mediapipe>=0.10.30,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9","ruff>=0.13,<1","mypy>=1.18,<2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
